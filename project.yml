name: TinyTiny
options:
  bundleIdPrefix: com.tinytiny
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TinyTiny:
    type: application
    platform: iOS
    sources:
      - TinyTiny
    info:
      path: TinyTiny/Info.plist
      properties:
        # Discreet name shown under the icon. Change this to whatever you want.
        CFBundleDisplayName: Calc
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "Unlock the app with Face ID."
        NSPhotoLibraryAddUsageDescription: "Save selected videos and images to your Photos library."
        NSPhotoLibraryUsageDescription: "Save and delete downloaded videos and images in your Photos library."
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.tinytiny.calc.drop
            CFBundleURLSchemes:
              - tinytiny
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinytiny.calc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

