name: Build TinyTiny APK

on:
  push:
    branches: [ main ]
    paths:
      - 'APK VERSION/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        working-directory: APK VERSION
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyTiny-apk
          path: APK VERSION/app/build/outputs/apk/release/app-release.apk

      - name: Publish Latest APK Release Asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "APK VERSION/app/build/outputs/apk/release/app-release.apk" TinyTiny.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest TinyTiny.apk --clobber
          else
            gh release create latest TinyTiny.apk --title "TinyTiny Latest Builds" --notes "Automated latest Android APK build"
          fi
